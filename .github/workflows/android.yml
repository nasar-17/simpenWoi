name: Android validation and APK

on:
  push:
    branches: [feat/ailocalfull]
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Record SDK versions
        run: flutter --version
      - name: Check Android assets
        run: python3 tools/check_local_assets.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart
        run: dart format lib test
      - name: Record resolved lockfile
        run: python3 -c "import pathlib,base64; print('RESOLVED_LOCKFILE=' + base64.b64encode(pathlib.Path('pubspec.lock').read_bytes()).decode())"
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test --coverage --reporter expanded
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/
          if-no-files-found: ignore

  apk:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: simpenWoi-arm64-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build emulator APK
        run: flutter build apk --debug --target-platform android-x64
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify startup on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/android_startup_smoke.py
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-diagnostics
          path: build/smoke/
          if-no-files-found: ignore
